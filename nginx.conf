server {
    # Port Directive
    listen 80;
    # Domain Matching
    server_name localhost;

    # Document Root - Vite's dist/ folder location
    root /usr/share/nginx/html;
    # Default Index - Default file (Root / URL without a specific filename)
    index index.html index.htm;

    # Route Location Block
    location / {
        # SPA Fallback Engine - send all navigation requests to index.html
        try_files $uri $uri/ /index.html;
    }

    # Compression Switch - Compress HTTP responses before transmission.
    gzip on;
    # Cache Header Directive - Sends Vary: Accept-Encoding header
    gzip_vary on;
    # Compression Threshold - Files larger than 1 KiB (1024 bytes)
    gzip_min_length 1024;
    # Proxy Compression Rule - Enables compression even for requests that pass through upstream proxies
    gzip_proxied expired no-cache no-store private auth;
    # Content MIME Filter - Whitelists exact file MIME types that should be gzipped
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    # Legacy Compatibility - Disables compression for ancient Internet Explorer versions
    gzip_disable "MSIE [1-6]\.";

    # Regex Location Block - Matches static media and bundle assets case-insensitively (~*) by their file extension
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff2?|eot|ttf|otf)$ {
        # Cache Expiry - Sets the HTTP Expires response header to 1 year in the future.
        expires 1y;
        # HTTP Cache Header - Informs browsers and edge CDNs that these files will never change once downloaded
        add_header Cache-Control "public, immutable";
    }

    # Security headers - Prevents MIME-type confusion attacks
        # Tells browsers strictly to follow declared Content-Type headers rather than guessing.
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Security headers - Instructs legacy browser filters to block rendering completely
        # If a reflected cross-site scripting attack is suspected.
    add_header X-Content-Type-Options "nosniff" always;
    # Security headers - Closes the main server block.
    add_header X-XSS-Protection "1; mode=block" always;
}